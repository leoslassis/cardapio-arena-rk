<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15120e">
  <title>Cardápio | Arena RK</title>
  <style>
    :root{color-scheme:dark;--bg:#15120e;--panel:#1e1a14;--gold:#efbc57;--line:#3c3224;--muted:#c4b9a7}
    *{box-sizing:border-box}
    html{scroll-padding-top:5.5rem}
    body{margin:0;background:var(--bg);color:#fff7ea;font-family:system-ui,sans-serif}
    header{padding:3.75rem 1rem 2.5rem;text-align:center;background:radial-gradient(ellipse at top,#3b2a15,var(--bg) 75%)}
    h1{font-size:clamp(2.8rem,8vw,4.6rem);line-height:1;margin:0;letter-spacing:-.06em}
    header p{margin:.75rem 0 0;color:var(--gold);text-transform:uppercase;letter-spacing:.19em;font-size:.875rem}
    nav{position:sticky;top:0;z-index:1;background:var(--bg);border-block:1px solid var(--line)}
    nav ul{display:flex;justify-content:center;gap:.4rem;list-style:none;padding:.65rem .4rem;margin:0}
    nav a{display:block;padding:.65rem .8rem;border-radius:999px;background:var(--panel);color:inherit;text-decoration:none;font-size:.875rem;font-weight:650;white-space:nowrap}
    nav a[aria-current]{background:var(--gold);color:#201609}
    a:focus-visible{outline:2px solid white;outline-offset:2px}
    main{max-width:42rem;margin:auto;padding:1.3rem 1rem 3rem}
    section{margin:0 0 2rem}
    h2{font-size:1.35rem;margin:0 0 .75rem}
    article{display:grid;grid-template-columns:minmax(0,1fr) clamp(5.5rem,26vw,8rem);gap:.8rem;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:.75rem;margin:.55rem 0}
    h3{font-size:1.06rem;margin:0}
    article p{margin:.35rem 0;color:var(--muted)}
    strong{display:block;color:var(--gold);font-size:1.25rem;margin-top:.35rem}
    img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:white;border-radius:.6rem}
    #baldes img{object-fit:cover}
  </style>
</head>
<body>
  <header><h1>Arena RK</h1><p>Cardápio digital</p></header>
  <nav aria-label="Categorias">
    <ul>
      <li><a href="#cervejas">Cervejas</a></li>
      <li><a href="#baldes">Baldes</a></li>
      <li><a href="#destilados">Destilados</a></li>
    </ul>
  </nav>
  <main>
    <section id="cervejas">
      <h2>Cervejas 600 ml</h2>
      <article><div><h3>Amstel 600 ml</h3><strong>R$ 16,00</strong></div><img src="imagens/cervejas/amstel-600ml.webp" alt="Garrafa Amstel"></article>
      <article><div><h3>Eisenbahn 600 ml</h3><strong>R$ 16,00</strong></div><img src="imagens/cervejas/eisenbahn-600ml.webp" alt="Garrafa Eisenbahn"></article>
    </section>
    <section id="baldes">
      <h2>Baldes</h2>
      <article><div><h3>Balde Amstel 600 ml</h3><strong>R$ 56,00</strong></div><img src="imagens/baldes/balde-amstel.webp" alt="Balde com garrafas Amstel"></article>
    </section>
    <section id="destilados">
      <h2>Combos de vodka</h2>
      <article><div><h3>Grey Goose</h3><p>4 gelos de coco + 4 energéticos ou tônicas.</p><strong>R$ 400,00</strong></div><img src="imagens/destilados/grey-goose.webp" alt="Garrafa Grey Goose"></article>
    </section>
  </main>
  <script>
    const links = document.querySelectorAll('nav a');
    function markCategory() {
      const category = location.hash || '#cervejas';
      for (const link of links) {
        if (link.hash === category) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      }
    }
    addEventListener('hashchange', markCategory);
    markCategory();
  </script>
</body>
</html>
