<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena RK</title>
  <script>
    const page = location.hostname === 'arenark.com.br' || location.hostname === 'www.arenark.com.br'
      ? 'arena/' : 'cardapio/';
    location.replace(new URL(page + location.search + location.hash, location.href));
  </script>
</head>
<body>
  <a href="cardapio/">Abrir o cardápio</a>
  <a href="arena/">Conhecer a Arena RK</a>
</body>
</html>
